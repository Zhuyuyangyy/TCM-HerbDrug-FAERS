  - herb: "甘草"
    drug: "hydrochlorothiazide"
    mechanism: "Potassium depletion synergy"
    severity: "moderate"
    source: "literature"
    cyp_enzyme: ""
    effect: "Severe hypokalemia"

  - herb: "当归"
    drug: "warfarin"
    mechanism: "CYP2C19 + coumarin components"
    severity: "moderate"
    source: "case_report"
    cyp_enzyme: "CYP2C19"
    effect: "Increased INR"

  - herb: "黄芩"
    drug: "cyclosporine"
    mechanism: "CYP3A4 inhibition by baicalin"
    severity: "major"
    source: "literature"
    cyp_enzyme: "CYP3A4"
    effect: "Increased cyclosporine levels"

  - herb: "大黄"
    drug: "digoxin"
    mechanism: "GI motility increase reducing absorption"
    severity: "moderate"
    source: "literature"
    cyp_enzyme: ""
    effect: "Reduced digoxin bioavailability"

  - herb: "圣约翰草"
