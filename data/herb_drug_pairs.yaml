  - herb: "丹参"
    drug: "clopidogrel"
    mechanism: "CYP2C19 inhibition"
    severity: "moderate"
    source: "literature"
    cyp_enzyme: "CYP2C19"
    effect: "Reduced antiplatelet effect"

  - herb: "甘草"
    drug: "digoxin"
    mechanism: "11beta-HSD2 inhibition causing hypokalemia"
    severity: "major"
    source: "EMA"
    cyp_enzyme: ""
