    mechanism: "CYP3A4 + P-gp induction"
    severity: "major"
    source: "FDA"
    cyp_enzyme: "CYP3A4"
    effect: "Subtherapeutic cyclosporine"

cyp_enzymes:
  CYP2C9:
    substrates: ["warfarin", "phenytoin", "tolbutamide", "losartan"]
    clinical_significance: "high"
  CYP2C19:
    substrates: ["clopidogrel", "omeprazole", "diazepam"]
    clinical_significance: "high"
  CYP3A4:
    substrates: ["cyclosporine", "tacrolimus", "simvastatin", "midazolam"]
    clinical_significance: "very_high"
  CYP2D6:
    substrates: ["metoprolol", "codeine", "tramadol", "fluoxetine"]
    clinical_significance: "high"
  CYP1A2:
    substrates: ["theophylline", "caffeine", "clozapine"]
    clinical_significance: "moderate"
